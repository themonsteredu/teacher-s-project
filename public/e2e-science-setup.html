<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>Career Log E2E setup</title>
<body><pre id="result">working…</pre><script>
const params = new URLSearchParams(location.search);
const action = params.get('cleanup') === '1' ? 'cleanup' : 'create';
const headers = {'x-career-e2e':'f91cb53a984f4df3a4e2924e','x-career-e2e-action':action};
if(params.get('board_id')) headers['x-career-e2e-board-id'] = params.get('board_id');
fetch('/api/index', {headers})
  .then(async (response) => ({ status: response.status, body: await response.json() }))
  .then((result) => { document.getElementById('result').textContent = JSON.stringify(result); })
  .catch((error) => { document.getElementById('result').textContent = String(error); });
</script></body></html>
