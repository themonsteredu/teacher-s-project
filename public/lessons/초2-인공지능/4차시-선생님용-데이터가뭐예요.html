    --paper:#F4F5F1; --ink:#1E2B28; --brand:#0F6B59; --brand2:#0A4C40;
    --gold:#F4B740; --gold-deep:#C98F22; --muted:#61716B; --line:#E3E7DF;
    --tint:#EAF0EA; --white:#fff;
    --body:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    --display:'Maplestory',"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:var(--body);
    background:linear-gradient(165deg,#E9EDE4 0%, #D7DFCE 100%);
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    padding:clamp(8px,3vw,24px); min-height:100vh; -webkit-text-size-adjust:100%;
  }
  .deck{
    width:min(1680px,94vw); background:var(--paper); border-radius:clamp(14px,2.4vw,20px);
    box-shadow:0 18px 50px rgba(30,50,40,.24), 0 2px 0 rgba(0,0,0,.02);
    overflow:hidden; display:flex; flex-direction:column;
  }

  /* 상단 얇은 바 */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px;
           padding:clamp(11px,2vw,14px) clamp(16px,3.5vw,24px); border-bottom:1px solid var(--line); }
  .course{ font-size:clamp(11.5px,2.3vw,13px); font-weight:700; color:var(--muted); letter-spacing:.01em; }
  .course b{ color:var(--brand); }
  .tools{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .counter{ font-size:clamp(11.5px,2.3vw,13px); font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
  .tbtn{ height:34px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:#fff;
         cursor:pointer; font-size:12px; color:var(--muted); font-weight:800; }
  .tbtn:active,.tbtn:hover{ border-color:var(--brand); color:var(--brand); }

  /* 본문 = 스파인 + 콘텐츠 */
  .board{ display:flex; align-items:stretch; }
  .spine{ flex:0 0 clamp(92px,14vw,132px); background:var(--brand); color:#fff;
          padding:clamp(20px,3vw,30px) clamp(14px,2.2vw,20px);
          display:flex; flex-direction:column; justify-content:space-between; position:relative; }
  .spine::after{ content:""; position:absolute; top:clamp(20px,3vw,30px); bottom:clamp(20px,3vw,30px); right:0;
                 width:3px; background:linear-gradient(var(--gold),transparent); border-radius:3px; opacity:.5; }
  .spine .phase{ font-size:clamp(13px,2.6vw,15px); font-weight:800; letter-spacing:.02em; }
  .spine .phase::before{ content:""; display:block; width:22px; height:4px; background:var(--gold);
                         border-radius:3px; margin-bottom:12px; }
  .spine .num{ font-family:var(--display); font-weight:700; font-size:clamp(2.3rem,6.4vw,3.8rem);
               color:var(--gold); line-height:.9; }
  .spine .num small{ display:block; font-family:var(--body); font-size:.85rem; font-weight:700;
                     color:rgba(255,255,255,.55); margin-top:8px; }

  .content{ flex:1; min-width:0; padding:clamp(30px,4.6vw,50px) clamp(24px,4.6vw,52px);
            display:flex; flex-direction:column; min-height:clamp(370px,54vh,540px); }

  .eyebrow{ display:inline-flex; align-items:center; gap:9px; align-self:flex-start;
            font-size:clamp(12px,2.5vw,14px); font-weight:800; color:var(--brand); margin-bottom:clamp(12px,2vw,16px); }
  .eyebrow::before{ content:""; width:9px; height:9px; background:var(--gold); border-radius:50%; box-shadow:0 0 0 4px rgba(244,183,64,.22); }

const el = id => document.getElementById(id);

function ytEmbed(url){ const m=url.match(/(?:youtu\.be\/|v=)([\w-]{11})/); return m?"https://www.youtube.com/embed/"+m[1]:null; }
function videoHTML(){
  if(!VIDEO_URL) return '<div class="frame"><div class="placeholder"><div class="pt">여기에 영상을 넣어 주세요</div>'+
    '<div class="ps">파일 맨 위 VIDEO_URL에 유튜브 주소나 영상 파일 주소를 붙여넣으면<br>이 자리에 영상이 재생됩니다.</div></div></div>';
  const yt=ytEmbed(VIDEO_URL);
  if(yt) return '<div class="frame"><iframe src="'+yt+'" allow="fullscreen" allowfullscreen></iframe></div>';
  if(/\.(mp4|webm|ogg|mov)$/i.test(VIDEO_URL)) return '<div class="frame"><video src="'+VIDEO_URL+'" controls></video></div>';
  return '<div class="frame"><iframe src="'+VIDEO_URL+'" allow="fullscreen" allowfullscreen></iframe></div>';
}

function render(){
  const s=SLIDES[i];
  el('counter').textContent=(i+1)+' / '+SLIDES.length;
  el('bar').style.width=((i+1)/SLIDES.length*100)+'%';
  el('phase').textContent=s.phase||'';
  el('num').innerHTML=String(i+1).padStart(2,'0')+'<small>/ '+String(SLIDES.length).padStart(2,'0')+'</small>';
  const hero=(s.layout==='cover'||s.layout==='key');
  el('board').classList.toggle('hero',hero);
  el('prev').disabled=i===0; el('next').disabled=i===SLIDES.length-1;

  let html='';
  const eyebrow = s.eyebrow ? '<div class="eyebrow">'+s.eyebrow+'</div>' : '';

  if(s.layout==='cover'){
    html='<div class="cover"><div class="cover-text"><h1 class="h1">'+s.title+'</h1><div class="accent-line"></div>'+
      (s.lead?'<p class="lead">'+s.lead+'</p>':'')+'</div><div class="cover-art">'+HERO_SVG+'</div></div>';

      '<div class="out"><div class="yes">'+s.outYes+'</div><div class="no">'+s.outNo+'</div></div></div>';

    html+=eyebrow;

    if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
    html+='<div class="accent-line"></div>';
    if(s.layout==='bullets'){
      html+='<ul class="bullets">'+ s.bullets.map(b=>'<li>'+b+'</li>').join('') +'</ul>';
    } else if(s.layout==='cards'){
      html+='<div class="grid'+(s.cards.length===2?' two':'')+'">'+
        s.cards.map(c=>'<div class="card">'+(c.icon&&ICONS[c.icon]?'<div class="ic">'+ICONS[c.icon]+'</div>':'')+'<h3>'+c.h+'</h3><p>'+c.p+'</p></div>').join('')+'</div>';
    } else if(s.layout==='cols'){
      html+='<div class="cols">'+ s.cols.map(c=>'<div class="col'+(c.ai?' ai':'')+'"><h3>'+c.h+'</h3><ul>'+
        c.items.map(it=>'<li>'+it+'</li>').join('')+'</ul></div>').join('') +'</div>';
    } else if(s.layout==='table'){
      html+='<div class="tablewrap"><table><thead><tr>'+ s.table.head.map((h,idx)=>'<th'+(idx===2?' class="ai-col"':'')+'>'+h+'</th>').join('') +'</tr></thead><tbody>'+
        s.table.rows.map(r=>'<tr>'+ r.map((c,idx)=>'<td'+(idx===2?' class="ai-col"':'')+'>'+c+'</td>').join('') +'</tr>').join('') +'</tbody></table></div>';
    } else if(s.layout==='video'){
      html+='<div class="video-wrap">'+ videoHTML() + (s.caption?'<div class="caption">'+s.caption+'</div>':'') +'</div>';
    }
    if(s.tag) html+='<div class="tag"><span>'+s.tag+'</span></div>';
  }
  el('stage').innerHTML=html;
}

el('prev').onclick=()=>{ if(i>0){ i--; render(); } };
el('next').onclick=()=>{ if(i<SLIDES.length-1){ i++; render(); } };
el('fsBtn').onclick=()=>{ const d=el('deck'); if(!document.fullscreenElement){ d.requestFullscreen&&d.requestFullscreen(); } else { document.exitFullscreen&&document.exitFullscreen(); } };
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); el('next').click(); } if(e.key==='ArrowLeft') el('prev').click(); });
render();
</script>
</body>
</html>
