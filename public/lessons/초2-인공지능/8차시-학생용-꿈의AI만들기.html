<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>꿈의 AI 만들기 · 초2 8차시</title>
<style>
  :root{
    --brand:#0f766e; --brand2:#0b5c55; --gold:#f4b740; --ink:#243b34;
    --muted:#5b6f68; --line:#e6ece5; --paper:#ffffff;
    --body:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{ box-sizing:border-box; word-break:keep-all; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  /* 배경(그라데이션)은 body에 */
  body{
    font-family:var(--body); color:var(--ink);
    background:
      radial-gradient(120% 90% at 15% 0%, #34c8a6 0%, rgba(52,200,166,0) 55%),
      radial-gradient(120% 90% at 100% 100%, #0c7d70 0%, rgba(12,125,112,0) 55%),
      linear-gradient(160deg,#1f9d84 0%, var(--brand2) 100%);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  /* ===== 최상위 카드는 반드시 .wrap ===== */
  .wrap{
    position:relative; overflow:hidden;
    width:min(580px,100%); background:var(--paper); border-radius:32px;
    box-shadow:0 20px 50px rgba(0,0,0,.22); padding:clamp(20px,5.5vw,34px); text-align:center;
  }
  /* 카드 위쪽 장식 띠 */
  .wrap::before{
    content:""; position:absolute; inset:0 0 auto 0; height:10px;
    background:linear-gradient(90deg,var(--brand),var(--gold),var(--brand2));
  }

  h1{ color:var(--brand); font-size:clamp(1.55rem,7vw,2.1rem); margin:.4rem 0 .2rem; line-height:1.2; }
  .sub{ color:var(--muted); font-weight:700; margin:.2rem 0 0; line-height:1.5; }
  .btns{ display:flex; flex-direction:column; gap:12px; margin-top:1.1rem; }
  button{ font-family:inherit; font-weight:800; font-size:clamp(1.05rem,4.8vw,1.2rem);
          border:0; border-radius:16px; padding:16px; cursor:pointer; transition:transform .08s, box-shadow .15s; }
  button:active{ transform:scale(.96); }
  .primary{ background:linear-gradient(160deg,#12867c,var(--brand2)); color:#fff; box-shadow:0 8px 18px rgba(11,92,85,.32); }
  .ghost{ background:#eef4ee; color:var(--ink); }
  .hide{ display:none; }

  /* ===== 진행 표시 ===== */
  .top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .step{ background:#eef4ee; color:var(--brand);
    font-weight:800; font-size:clamp(.85rem,3.6vw,1rem); padding:7px 15px; border-radius:999px; }
  .scorepill{ background:#fff7e6; color:#8a6400; font-weight:800; font-size:clamp(.85rem,3.6vw,1rem);
    padding:7px 15px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; }
  .bar{ height:12px; background:#eef4ee; border-radius:999px; overflow:hidden; margin:12px 0 4px; }
  .bar > i{ display:block; height:100%; width:0%;
    background:linear-gradient(90deg,var(--brand),#37c4a4); border-radius:999px; transition:width .35s ease; }

  /* ===== 홈 히어로 ===== */
  .hero{ margin:.2rem auto .4rem; width:clamp(150px,52vw,220px); }
  .hero svg{ width:100%; height:auto; display:block; }
  .float{ animation:float 3s ease-in-out infinite; transform-origin:center; }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
  .spark{ animation:spark 2.4s ease-in-out infinite; transform-origin:center; }
  @keyframes spark{ 0%,100%{ opacity:.35; transform:scale(.9) } 50%{ opacity:1; transform:scale(1.15) } }

  /* ===== 미니게임 카드 ===== */
  .scene{ position:relative; background:linear-gradient(160deg,#f3fbf8,#e4f4ef); border:3px solid var(--line);
    border-radius:24px; padding:clamp(14px,4.5vw,22px); margin:14px 0; }
  .scene .art{ width:clamp(120px,42vw,180px); margin:0 auto; }
  .scene .art svg{ width:100%; height:auto; display:block; }
  .scene .name{ font-size:clamp(1.25rem,6vw,1.6rem); font-weight:800; margin-top:10px; color:var(--ink); }
  .ask{ font-size:clamp(1rem,4.4vw,1.2rem); font-weight:800; color:var(--muted); margin:.35rem 0 0; }
  .pop{ animation:pop .4s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes pop{ 0%{ transform:scale(.7); opacity:0 } 100%{ transform:scale(1); opacity:1 } }

  .row2{ display:flex; gap:12px; }
  .row2 button{ flex:1; }
  .yes{ background:linear-gradient(160deg,#12867c,var(--brand2)); color:#fff; box-shadow:0 8px 18px rgba(11,92,85,.28); }
  .no{ background:#fff0e6; color:#b5581f; }
  .feedback{ min-height:1.2em; font-weight:800; font-size:clamp(1.02rem,4.4vw,1.2rem); margin:14px 0 6px; }
  .feedback.ok{ color:var(--brand); }
  .feedback.bad{ color:#c0623a; }
  .feedback .head{ display:inline-flex; align-items:center; gap:8px; justify-content:center; }
  .feedback .head svg{ width:1.3em; height:1.3em; }
  .feedback small{ display:block; font-weight:700; color:var(--muted); margin-top:8px; font-size:.82em; line-height:1.5; }
  .shake{ animation:shake .4s both; }
  @keyframes shake{ 0%,100%{ transform:translateX(0) } 20%,60%{ transform:translateX(-7px) } 40%,80%{ transform:translateX(7px) } }

  /* 정답 별 튀기기 */
  .burst{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .burst span{ position:absolute; top:46%; left:50%; width:12px; height:12px; opacity:0; }
  .burst.go span{ animation:burst .7s ease-out forwards; }
  @keyframes burst{ 0%{ opacity:1; transform:translate(-50%,-50%) scale(.4) }
    100%{ opacity:0; transform:translate(var(--tx),var(--ty)) scale(1.1) } }

  /* ===== 디자인 화면 ===== */
  .label{ text-align:left; font-weight:800; color:var(--ink); margin:18px 0 9px;
    font-size:clamp(1rem,4.2vw,1.15rem); display:flex; align-items:center; gap:8px; }
  .label b{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
    background:var(--brand); color:#fff; border-radius:50%; font-size:.85rem; flex:0 0 auto; }
  input[type=text]{ width:100%; font-family:inherit; font-size:clamp(1.05rem,5vw,1.2rem);
    font-weight:800; text-align:center; padding:14px; border:3px solid var(--line);
    border-radius:16px; color:var(--ink); background:#fbfefc; }
  input[type=text]:focus{ outline:none; border-color:var(--brand); }
  .chips{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip{ background:#eef4ee; color:var(--ink); border:3px solid transparent;
    border-radius:16px; padding:12px 10px; font-size:clamp(.98rem,4.2vw,1.1rem); flex:1 1 44%;
    display:flex; align-items:center; justify-content:center; gap:7px; }
  .chip svg{ width:1.4em; height:1.4em; flex:0 0 auto; }
  .chip.sel{ background:#fff; border-color:var(--brand); color:var(--brand); box-shadow:0 6px 14px rgba(15,118,110,.15); }

  /* 옵션 버튼(색/눈/안테나) */
  .opts{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .opt{ background:#f4f8f4; border:3px solid transparent; border-radius:16px; padding:8px;
    width:clamp(58px,17vw,72px); height:clamp(58px,17vw,72px);
    display:flex; align-items:center; justify-content:center; }
  .opt svg{ width:100%; height:100%; }
  .opt.sel{ background:#fff; border-color:var(--gold); box-shadow:0 6px 14px rgba(244,183,64,.3); }
  .swatch{ width:26px; height:26px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.06); }

  /* ===== 내 AI 카드 ===== */
  .aicard{ position:relative; overflow:hidden; background:linear-gradient(160deg,#0f766e,#0b5c55); color:#fff;
    border-radius:26px; padding:clamp(16px,5vw,26px); margin:18px 0 4px;
    box-shadow:0 12px 30px rgba(11,92,85,.38); }
  .aicard::after{ content:""; position:absolute; top:-40%; right:-20%; width:70%; height:120%;
    background:radial-gradient(circle, rgba(255,255,255,.14), rgba(255,255,255,0) 70%); }
  .aicard .avatar{ width:clamp(120px,38vw,170px); margin:0 auto; position:relative; z-index:1; }
  .aicard .avatar svg{ width:100%; height:auto; display:block; }
  .aicard .ai-name{ font-size:clamp(1.4rem,7vw,2rem); font-weight:800; margin:10px 0 4px; position:relative; z-index:1; }
  .aicard .ai-job{ font-size:clamp(1rem,4.6vw,1.25rem); font-weight:700; color:#eafaf5; position:relative; z-index:1; }
  .aicard .tag{ display:inline-block; background:var(--gold); color:#5a3d00;
    font-weight:800; border-radius:999px; padding:6px 16px; margin-top:12px; font-size:.92rem; position:relative; z-index:1; }
  .big-card{ animation:cardin .5s cubic-bezier(.2,1.2,.4,1) both; }
  @keyframes cardin{ 0%{ transform:scale(.8) rotate(-2deg); opacity:0 } 100%{ transform:scale(1) rotate(0); opacity:1 } }

  /* 완성 화면 색종이 */
  .end-head{ position:relative; }
  .conf{ position:absolute; inset:-10px 0 auto 0; height:120px; pointer-events:none; overflow:visible; }
  .conf i{ position:absolute; top:-14px; width:11px; height:16px; border-radius:2px; opacity:0;
    animation:fall 2.6s linear infinite; }
  @keyframes fall{ 0%{ transform:translateY(-10px) rotate(0); opacity:0 }
    10%{ opacity:1 } 100%{ transform:translateY(320px) rotate(540deg); opacity:0 } }
  .board{ display:flex; align-items:flex-start; gap:10px; text-align:left; background:#fff7e6;
    border:3px solid #ffe6ad; border-radius:18px; padding:14px 16px; margin-top:12px; }
  .board svg{ width:38px; height:38px; flex:0 0 auto; }
  .board p{ margin:0; font-weight:800; color:#7a5600; font-size:clamp(.95rem,4vw,1.1rem); line-height:1.5; }
</style>
</head>
<body>
  <div class="wrap">

    <!-- ===== 홈 ===== -->
    <section id="s-start">
      <div class="hero float">
        <!-- 마스코트 로봇 (인라인 SVG) -->
        <svg viewBox="0 0 200 200" role="img" aria-label="AI 로봇">
          <circle class="spark" cx="34" cy="40" r="7" fill="#f4b740"/>
          <circle class="spark" cx="168" cy="58" r="5" fill="#f4b740" style="animation-delay:.6s"/>
          <circle class="spark" cx="150" cy="26" r="4" fill="#f4b740" style="animation-delay:1.1s"/>
          <line x1="100" y1="34" x2="100" y2="16" stroke="#0b5c55" stroke-width="6" stroke-linecap="round"/>
          <circle cx="100" cy="12" r="9" fill="#f4b740"/>
          <rect x="46" y="34" width="108" height="96" rx="30" fill="#0f766e"/>
          <rect x="60" y="52" width="80" height="52" rx="20" fill="#e9fbf5"/>
          <circle cx="84" cy="78" r="10" fill="#0f766e"/><circle cx="87" cy="75" r="3.5" fill="#fff"/>
          <circle cx="116" cy="78" r="10" fill="#0f766e"/><circle cx="119" cy="75" r="3.5" fill="#fff"/>
          <path d="M84 96 q16 12 32 0" stroke="#0f766e" stroke-width="5" fill="none" stroke-linecap="round"/>
          <rect x="64" y="132" width="72" height="40" rx="16" fill="#0b5c55"/>
          <rect x="76" y="146" width="48" height="8" rx="4" fill="#37c4a4"/>
          <rect x="34" y="70" width="14" height="40" rx="7" fill="#0b5c55"/>
          <rect x="152" y="70" width="14" height="40" rx="7" fill="#0b5c55"/>
        </svg>
      </div>
      <h1 data-title>꿈의 AI 만들기</h1>
      <p class="sub">우리 곁의 AI를 찾아보고<br>세상에 하나뿐인 <b>나만의 AI</b>를 만들어요!</p>
      <div class="btns"><button class="primary" onclick="startGame()">시작하기 ▶</button></div>
    </section>

    <!-- ===== ① 생활 속 AI 찾기 (미니게임) ===== -->
    <section id="s-game" class="hide">
      <div class="top">
        <span class="step" id="g-step">1 / 10</span>
        <span class="scorepill">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6L2.5 8.9l6.6-.8z" fill="#f4b740"/></svg>
          <span id="g-score">0</span>점
        </span>
      </div>
      <div class="bar"><i id="g-bar"></i></div>

      <div class="scene">
        <div class="burst" id="g-burst"><span>⭐</span><span>✨</span><span>⭐</span><span>✨</span><span>⭐</span><span>✨</span></div>
        <div class="art" id="g-art"></div>
        <div class="name" id="g-name">스마트 스피커</div>
        <div class="ask">🤔 이건 AI일까요?</div>
      </div>

      <div class="row2" id="g-choose">
        <button class="yes" onclick="answer(true)">AI예요</button>
        <button class="no" onclick="answer(false)">아니에요</button>
      </div>
      <div class="feedback" id="g-fb"></div>
      <div class="btns" id="g-next" style="display:none">
        <button class="primary" onclick="nextItem()">다음 ▶</button>
      </div>
    </section>

    <!-- ===== ② 꿈의 AI 디자인 ===== -->
    <section id="s-design" class="hide">
      <div class="top"><span class="step">✏️ 나만의 AI 만들기</span></div>

      <div class="label"><b>1</b> AI 이름을 지어요</div>
      <input type="text" id="d-name" maxlength="10" placeholder="예: 반짝이, 도우미봇" oninput="render()" />

      <div class="label"><b>2</b> 하는 일을 골라요</div>
      <div class="chips" id="d-jobs">
        <button class="chip" data-job="도와주는" onclick="pickJob(this)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.6-9.3-9C1.2 9 2.8 5.5 6 5.5c1.9 0 3.2 1.1 4 2.3.8-1.2 2.1-2.3 4-2.3 3.2 0 4.8 3.5 3.3 6.5C19 16.4 12 21 12 21z" fill="#e5533b"/></svg>
          도와주기</button>
        <button class="chip" data-job="놀아주는" onclick="pickJob(this)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="9" rx="4.5" fill="#0f766e"/><circle cx="8" cy="12.5" r="1.6" fill="#fff"/><circle cx="16" cy="11" r="1.4" fill="#f4b740"/><circle cx="18" cy="14" r="1.4" fill="#f4b740"/></svg>
          놀아주기</button>
        <button class="chip" data-job="가르쳐주는" onclick="pickJob(this)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 4-9 4-9-4 9-4z" fill="#0f766e"/><path d="M6 10v4c0 1.6 2.7 3 6 3s6-1.4 6-3v-4" fill="#37c4a4"/></svg>
          가르치기</button>
        <button class="chip" data-job="지켜주는" onclick="pickJob(this)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.4-3 8-7 10-4-2-7-5.6-7-10V6l7-3z" fill="#0f766e"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          지켜주기</button>
        <button class="chip" data-job="청소해주는" onclick="pickJob(this)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3l3 3-7 7-3-3 7-7z" fill="#f4b740"/><path d="M8 11l-4 7 7-4-3-3z" fill="#0f766e"/></svg>
          청소하기</button>
        <button class="chip" data-job="치료해주는" onclick="pickJob(this)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9.5" y="4" width="5" height="16" rx="2" fill="#e5533b"/><rect x="4" y="9.5" width="16" height="5" rx="2" fill="#e5533b"/></svg>
          치료하기</button>
      </div>

      <div class="label"><b>3</b> 몸 색깔을 골라요</div>
      <div class="opts" id="d-colors"></div>

      <div class="label"><b>4</b> 눈 모양을 골라요</div>
      <div class="opts" id="d-eyes"></div>

      <div class="label"><b>5</b> 머리 장식을 골라요</div>
      <div class="opts" id="d-ant"></div>

      <div class="label" style="justify-content:center; margin-top:22px;">👀 내 AI 미리보기</div>
      <div class="aicard">
        <div class="avatar" id="p-avatar"></div>
        <div class="ai-name" id="p-name">이름을 지어주세요</div>
        <div class="ai-job" id="p-job">하는 일을 골라주세요</div>
        <div class="tag">나의 꿈의 AI</div>
      </div>

      <div class="btns"><button class="primary" onclick="finish()">완성하기 🎉</button></div>
    </section>

    <!-- ===== ③ 완성 ===== -->
    <section id="s-end" class="hide">
      <div class="end-head">
        <div class="conf" id="conf"></div>
        <h1>멋진 AI가 완성됐어요!</h1>
      </div>
      <div class="aicard big-card">
        <div class="avatar" id="e-avatar"></div>
        <div class="ai-name" id="e-name">반짝이</div>
        <div class="ai-job" id="e-job">도와주는 AI</div>
        <div class="tag">나의 꿈의 AI</div>
      </div>
      <div class="board">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2" fill="#0f766e"/><path d="M6 15l3-4 2.5 3 3-4L18 15z" fill="#fff"/><circle cx="8" cy="8.5" r="1.6" fill="#f4b740"/><rect x="9" y="20" width="6" height="2" rx="1" fill="#7a5600"/></svg>
        <p>우리 반 <b>활동보드</b>에 붙여서<br>친구들과 <b>AI 전시회</b>를 열어요!</p>
      </div>
      <div class="btns"><button class="ghost" onclick="restart()">다시 만들기 🔁</button></div>
    </section>

  </div>

<script>
  // ===== 화면 전환 =====
  function go(id){
    document.querySelectorAll('.wrap > section').forEach(function(s){ s.classList.add('hide'); });
    document.getElementById(id).classList.remove('hide');
    document.querySelector('.wrap').scrollTop = 0;
    window.scrollTo(0,0);
  }

  // ===== 인라인 SVG 그림 모음 (게임 항목) =====
  var ART = {
    speaker:'<svg viewBox="0 0 120 120"><path d="M42 26h36l6 68a8 8 0 0 1-8 9H44a8 8 0 0 1-8-9z" fill="#0f766e"/><rect x="44" y="40" width="32" height="26" rx="6" fill="#0b5c55"/><circle cx="60" cy="53" r="9" fill="#37c4a4"/><circle cx="60" cy="53" r="4" fill="#f4b740"/><g stroke="#f4b740" stroke-width="4" fill="none" stroke-linecap="round"><path d="M88 40q8 13 0 26"/><path d="M96 33q13 20 0 40"/></g></svg>',
    translate:'<svg viewBox="0 0 120 120"><rect x="14" y="24" width="56" height="44" rx="10" fill="#0f766e"/><path d="M30 60l14 14v-14z" fill="#0f766e"/><text x="42" y="54" font-size="26" font-weight="900" text-anchor="middle" fill="#fff" font-family="sans-serif">A</text><rect x="50" y="52" width="56" height="44" rx="10" fill="#f4b740"/><path d="M90 88l14 14V88z" fill="#f4b740"/><text x="78" y="82" font-size="26" font-weight="900" text-anchor="middle" fill="#5a3d00" font-family="sans-serif">가</text></svg>',
    vacuum:'<svg viewBox="0 0 120 120"><ellipse cx="60" cy="96" rx="34" ry="7" fill="#cfe6df"/><circle cx="60" cy="64" r="36" fill="#0f766e"/><circle cx="60" cy="64" r="22" fill="#0b5c55"/><circle cx="60" cy="64" r="9" fill="#37c4a4"/><rect x="46" y="30" width="28" height="9" rx="4.5" fill="#f4b740"/><circle cx="52" cy="34" r="2.6" fill="#0b5c55"/><circle cx="68" cy="34" r="2.6" fill="#0b5c55"/><g stroke="#37c4a4" stroke-width="3" stroke-linecap="round"><path d="M24 96l-6 6"/><path d="M96 96l6 6"/></g></svg>',
    video:'<svg viewBox="0 0 120 120"><rect x="16" y="26" width="88" height="60" rx="10" fill="#0f766e"/><path d="M50 44l24 12-24 12z" fill="#fff"/><rect x="40" y="92" width="40" height="7" rx="3.5" fill="#0b5c55"/><path d="M92 30c5-6 15-2 12 6-2 5-12 9-12 9s-10-4-12-9c-3-8 7-12 12-6z" fill="#f4b740"/></svg>',
    car:'<svg viewBox="0 0 120 120"><g stroke="#f4b740" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"><path d="M96 44q10 16 0 32"/><path d="M104 36q16 24 0 48"/></g><path d="M20 74l8-22a10 10 0 0 1 9-6h30a10 10 0 0 1 8 5l9 15v14a5 5 0 0 1-5 5H25a5 5 0 0 1-5-5z" fill="#0f766e"/><path d="M34 52h30l7 12H30z" fill="#cfeee6"/><circle cx="38" cy="82" r="9" fill="#0b5c55"/><circle cx="38" cy="82" r="3.5" fill="#37c4a4"/><circle cx="74" cy="82" r="9" fill="#0b5c55"/><circle cx="74" cy="82" r="3.5" fill="#37c4a4"/></svg>',
    faceid:'<svg viewBox="0 0 120 120"><g stroke="#0f766e" stroke-width="6" fill="none" stroke-linecap="round"><path d="M30 44V34h10"/><path d="M90 44V34H80"/><path d="M30 76v10h10"/><path d="M90 76v10H80"/></g><circle cx="60" cy="60" r="20" fill="#f4b740"/><circle cx="53" cy="56" r="3" fill="#5a3d00"/><circle cx="67" cy="56" r="3" fill="#5a3d00"/><path d="M52 68q8 6 16 0" stroke="#5a3d00" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="34" y="59" width="52" height="3" rx="1.5" fill="#e5533b" opacity=".8"/></svg>',
    book:'<svg viewBox="0 0 120 120"><path d="M60 34c-9-6-22-8-32-6v56c10-2 23 0 32 6z" fill="#0f766e"/><path d="M60 34c9-6 22-8 32-6v56c-10-2-23 0-32 6z" fill="#37c4a4"/><g stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".8"><path d="M36 48h16"/><path d="M36 58h16"/><path d="M68 48h16"/><path d="M68 58h16"/></g><rect x="57" y="32" width="6" height="60" rx="3" fill="#0b5c55"/></svg>',
    watch:'<svg viewBox="0 0 120 120"><rect x="50" y="18" width="20" height="22" rx="5" fill="#0b5c55"/><rect x="50" y="80" width="20" height="22" rx="5" fill="#0b5c55"/><circle cx="60" cy="60" r="30" fill="#0f766e"/><circle cx="60" cy="60" r="23" fill="#e9fbf5"/><g stroke="#0b5c55" stroke-width="4" stroke-linecap="round"><path d="M60 60V44"/><path d="M60 60l12 8"/></g><circle cx="60" cy="60" r="3.5" fill="#e5533b"/></svg>',
    calc:'<svg viewBox="0 0 120 120"><rect x="30" y="20" width="60" height="80" rx="10" fill="#0f766e"/><rect x="40" y="30" width="40" height="18" rx="4" fill="#cfeee6"/><g fill="#e9fbf5"><rect x="40" y="56" width="11" height="11" rx="3"/><rect x="55" y="56" width="11" height="11" rx="3"/><rect x="70" y="56" width="11" height="11" rx="3"/><rect x="40" y="71" width="11" height="11" rx="3"/><rect x="55" y="71" width="11" height="11" rx="3"/><rect x="70" y="71" width="11" height="11" rx="3" fill="#f4b740"/><rect x="40" y="86" width="26" height="9" rx="3"/><rect x="70" y="86" width="11" height="9" rx="3" fill="#f4b740"/></g></svg>',
    bike:'<svg viewBox="0 0 120 120"><g fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="76" r="18"/><circle cx="88" cy="76" r="18"/><path d="M32 76l16-30h22"/><path d="M48 46l14 30"/><path d="M88 76l-12-34h10"/></g><circle cx="32" cy="76" r="4" fill="#f4b740"/><circle cx="88" cy="76" r="4" fill="#f4b740"/><path d="M44 40h12" stroke="#0b5c55" stroke-width="5" stroke-linecap="round"/></svg>'
  };

  // ===== ① 미니게임 데이터 (10개) =====
  var ITEMS = [
    { art:'speaker',   name:'스마트 스피커', ai:true,  why:'내 말을 알아듣고 대답해줘요. 그래서 AI예요.' },
    { art:'translate', name:'자동 번역기',   ai:true,  why:'다른 나라 말을 척척 바꿔줘요. AI가 배워서 할 수 있어요.' },
    { art:'book',      name:'종이책',        ai:false, why:'스스로 생각하지 못해요. 우리가 읽는 책일 뿐이에요.' },
    { art:'vacuum',    name:'로봇 청소기',   ai:true,  why:'스스로 길을 찾아 청소해요. AI가 판단해서 움직여요.' },
    { art:'watch',     name:'그냥 손목시계', ai:false, why:'시간만 알려줘요. 생각을 하지 못해서 AI가 아니에요.' },
    { art:'video',     name:'추천 영상',     ai:true,  why:'내가 좋아할 영상을 골라줘요. AI가 내 취향을 배워요.' },
    { art:'car',       name:'자율주행 자동차', ai:true, why:'사람 없이 스스로 운전해요. AI가 길과 신호를 살펴요.' },
    { art:'calc',      name:'계산기',        ai:false, why:'누른 대로만 계산해요. 스스로 배우지 않아 AI가 아니에요.' },
    { art:'faceid',    name:'얼굴 인식',     ai:true,  why:'얼굴을 보고 누구인지 알아봐요. AI가 얼굴을 기억해요.' },
    { art:'bike',      name:'자전거',        ai:false, why:'내가 페달을 밟아야 움직여요. 스스로 못 해서 AI가 아니에요.' }
  ];
  var idx = 0, score = 0;

  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#0f766e"/><path d="M7 12.5l3.2 3.3L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#e5533b"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';

  function startGame(){ idx = 0; score = 0; showItem(); go('s-game'); }

  function showItem(){
    var it = ITEMS[idx];
    var art = document.getElementById('g-art');
    art.innerHTML = ART[it.art];
    art.classList.remove('pop'); void art.offsetWidth; art.classList.add('pop');
    document.getElementById('g-name').textContent = it.name;
    document.getElementById('g-step').textContent = (idx+1) + ' / ' + ITEMS.length;
    document.getElementById('g-bar').style.width = ((idx)/ITEMS.length*100) + '%';
    var fb = document.getElementById('g-fb'); fb.innerHTML=''; fb.className='feedback';
    document.getElementById('g-choose').style.display = 'flex';
    document.getElementById('g-next').style.display = 'none';
    document.getElementById('g-score').textContent = score;
  }

  function answer(pick){
    var it = ITEMS[idx];
    var correct = (pick === it.ai);
    if(correct){ score++; }
    var fb = document.getElementById('g-fb');
    var head = correct ? (CHECK + '정답이에요!') : (CROSS + '아쉬워요!');
    var truth = it.ai ? '이건 AI가 맞아요.' : '이건 AI가 아니에요.';
    fb.className = 'feedback ' + (correct ? 'ok' : 'bad');
    fb.innerHTML = '<span class="head">' + head + '</span> ' + truth + '<small>' + it.why + '</small>';

    if(correct){
      var b = document.getElementById('g-burst');
      b.querySelectorAll('span').forEach(function(s,i){
        var a = (i/6)*Math.PI*2;
        s.style.setProperty('--tx', (Math.cos(a)*70) + 'px');
        s.style.setProperty('--ty', (Math.sin(a)*70 - 10) + 'px');
      });
      b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
    } else {
      var art = document.getElementById('g-art');
      art.classList.remove('shake'); void art.offsetWidth; art.classList.add('shake');
    }

    document.getElementById('g-choose').style.display = 'none';
    var isLast = (idx === ITEMS.length - 1);
    document.getElementById('g-next').firstElementChild.textContent = isLast ? '나만의 AI 만들기 ▶' : '다음 ▶';
    document.getElementById('g-next').style.display = 'flex';
    document.getElementById('g-bar').style.width = ((idx+1)/ITEMS.length*100) + '%';
    document.getElementById('g-score').textContent = score;
  }

  function nextItem(){
    if(idx === ITEMS.length - 1){ go('s-design'); render(); return; }
    idx++; showItem();
  }

  // ===== ② 디자인: 옵션 정의 =====
  var COLORS = [
    {id:'teal', body:'#0f766e', dark:'#0b5c55', face:'#e9fbf5'},
    {id:'gold', body:'#f4b740', dark:'#d99a1f', face:'#fff7e6'},
    {id:'coral',body:'#e5533b', dark:'#c23e29', face:'#fff0ec'},
    {id:'blue', body:'#3b7de5', dark:'#2a5fbf', face:'#eaf1ff'},
    {id:'purple',body:'#8b5cf6', dark:'#6d3fd4', face:'#f2ecff'},
    {id:'mint', body:'#2fb98a', dark:'#1f9670', face:'#e8fbf3'}
  ];
  var EYES = ['round','happy','star','wink','square'];
  var ANT  = ['ball','double','heart','star','none'];

  var sel = { color:'teal', eyes:'round', ant:'ball', job:'', name:'' };

  // 로봇 아바타 SVG 생성기
  function robotSVG(c, eyes, ant){
    var col = COLORS.find(function(x){return x.id===c;}) || COLORS[0];
    var s = '<svg viewBox="0 0 200 200" role="img" aria-label="내 AI 로봇">';
    // 머리 장식(안테나)
    if(ant==='ball'){
      s += '<line x1="100" y1="46" x2="100" y2="24" stroke="'+col.dark+'" stroke-width="7" stroke-linecap="round"/><circle cx="100" cy="18" r="10" fill="#f4b740"/>';
    } else if(ant==='double'){
      s += '<line x1="74" y1="48" x2="66" y2="26" stroke="'+col.dark+'" stroke-width="6" stroke-linecap="round"/><circle cx="64" cy="20" r="8" fill="#f4b740"/>';
      s += '<line x1="126" y1="48" x2="134" y2="26" stroke="'+col.dark+'" stroke-width="6" stroke-linecap="round"/><circle cx="136" cy="20" r="8" fill="#f4b740"/>';
    } else if(ant==='heart'){
      s += '<line x1="100" y1="46" x2="100" y2="30" stroke="'+col.dark+'" stroke-width="7" stroke-linecap="round"/><path d="M100 20c-5-7-16-3-16 4 0 6 9 11 16 16 7-5 16-10 16-16 0-7-11-11-16-4z" fill="#e5533b"/>';
    } else if(ant==='star'){
      s += '<line x1="100" y1="46" x2="100" y2="30" stroke="'+col.dark+'" stroke-width="7" stroke-linecap="round"/><path d="M100 8l4.5 9.3 10.2 1.3-7.5 7 1.9 10.1L100 40.9l-9 4.8 1.9-10.1-7.5-7 10.2-1.3z" fill="#f4b740"/>';
    }
    // 몸통/머리
    s += '<rect x="44" y="46" width="112" height="102" rx="32" fill="'+col.body+'"/>';
    s += '<rect x="46" y="150" width="14" height="26" rx="7" fill="'+col.dark+'"/>';
    s += '<rect x="140" y="150" width="14" height="26" rx="7" fill="'+col.dark+'"/>';
    // 얼굴 화면
    s += '<rect x="60" y="66" width="80" height="60" rx="22" fill="'+col.face+'"/>';
    // 눈
    var eR = col.body;
    if(eyes==='round'){
      s += '<circle cx="84" cy="92" r="11" fill="'+eR+'"/><circle cx="88" cy="88" r="4" fill="#fff"/>';
      s += '<circle cx="116" cy="92" r="11" fill="'+eR+'"/><circle cx="120" cy="88" r="4" fill="#fff"/>';
    } else if(eyes==='happy'){
      s += '<path d="M74 96q10-14 20 0" stroke="'+eR+'" stroke-width="6" fill="none" stroke-linecap="round"/>';
      s += '<path d="M106 96q10-14 20 0" stroke="'+eR+'" stroke-width="6" fill="none" stroke-linecap="round"/>';
    } else if(eyes==='star'){
      s += '<path d="M84 80l3 6.5 7 .9-5.2 4.8 1.3 7L84 100l-6.4 3.2 1.3-7L73.8 87.4l7-.9z" fill="'+eR+'"/>';
      s += '<path d="M116 80l3 6.5 7 .9-5.2 4.8 1.3 7L116 100l-6.4 3.2 1.3-7-5.2-4.8 7-.9z" fill="'+eR+'"/>';
    } else if(eyes==='wink'){
      s += '<circle cx="84" cy="92" r="11" fill="'+eR+'"/><circle cx="88" cy="88" r="4" fill="#fff"/>';
      s += '<path d="M106 94q10-10 20 0" stroke="'+eR+'" stroke-width="6" fill="none" stroke-linecap="round"/>';
    } else if(eyes==='square'){
      s += '<rect x="74" y="84" width="20" height="16" rx="4" fill="'+eR+'"/><rect x="78" y="87" width="6" height="6" rx="2" fill="#fff"/>';
      s += '<rect x="106" y="84" width="20" height="16" rx="4" fill="'+eR+'"/><rect x="110" y="87" width="6" height="6" rx="2" fill="#fff"/>';
    }
    // 입/볼
    s += '<path d="M86 112q14 9 28 0" stroke="'+eR+'" stroke-width="5" fill="none" stroke-linecap="round"/>';
    s += '<circle cx="70" cy="108" r="5" fill="#f4b740" opacity=".7"/><circle cx="130" cy="108" r="5" fill="#f4b740" opacity=".7"/>';
    s += '</svg>';
    return s;
  }

  // 옵션 버튼용 미니 미리보기 SVG
  function swatchColor(col){ return '<div class="swatch" style="background:'+col.body+'"></div>'; }
  function eyeIcon(kind){
    return '<svg viewBox="0 0 60 40">'+ eyePair(kind,'#0f766e') +'</svg>';
  }
  function eyePair(eyes, eR){
    if(eyes==='round') return '<circle cx="20" cy="20" r="9" fill="'+eR+'"/><circle cx="23" cy="16" r="3" fill="#fff"/><circle cx="40" cy="20" r="9" fill="'+eR+'"/><circle cx="43" cy="16" r="3" fill="#fff"/>';
    if(eyes==='happy') return '<path d="M11 24q9-13 18 0" stroke="'+eR+'" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M31 24q9-13 18 0" stroke="'+eR+'" stroke-width="5" fill="none" stroke-linecap="round"/>';
    if(eyes==='star') return '<path d="M20 9l2.6 5.6 6 .8-4.5 4.1 1.1 6L20 28.6l-5.2 2.9 1.1-6-4.5-4.1 6-.8z" fill="'+eR+'"/><path d="M40 9l2.6 5.6 6 .8-4.5 4.1 1.1 6L40 28.6l-5.2 2.9 1.1-6-4.5-4.1 6-.8z" fill="'+eR+'"/>';
    if(eyes==='wink') return '<circle cx="20" cy="20" r="9" fill="'+eR+'"/><circle cx="23" cy="16" r="3" fill="#fff"/><path d="M31 22q9-9 18 0" stroke="'+eR+'" stroke-width="5" fill="none" stroke-linecap="round"/>';
    return '<rect x="11" y="12" width="18" height="15" rx="4" fill="'+eR+'"/><rect x="15" y="15" width="5" height="5" rx="2" fill="#fff"/><rect x="31" y="12" width="18" height="15" rx="4" fill="'+eR+'"/><rect x="35" y="15" width="5" height="5" rx="2" fill="#fff"/>';
  }
  function antIcon(kind){
    var s='<svg viewBox="0 0 60 60"><rect x="16" y="30" width="28" height="22" rx="8" fill="#0f766e"/>';
    if(kind==='ball') s+='<line x1="30" y1="30" x2="30" y2="14" stroke="#0b5c55" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="10" r="7" fill="#f4b740"/>';
    else if(kind==='double') s+='<line x1="22" y1="31" x2="17" y2="16" stroke="#0b5c55" stroke-width="4" stroke-linecap="round"/><circle cx="16" cy="12" r="5" fill="#f4b740"/><line x1="38" y1="31" x2="43" y2="16" stroke="#0b5c55" stroke-width="4" stroke-linecap="round"/><circle cx="44" cy="12" r="5" fill="#f4b740"/>';
    else if(kind==='heart') s+='<line x1="30" y1="30" x2="30" y2="18" stroke="#0b5c55" stroke-width="5" stroke-linecap="round"/><path d="M30 10c-3-4-9-2-9 2 0 4 5 6 9 9 4-3 9-5 9-9 0-4-6-6-9-2z" fill="#e5533b"/>';
    else if(kind==='star') s+='<line x1="30" y1="30" x2="30" y2="18" stroke="#0b5c55" stroke-width="5" stroke-linecap="round"/><path d="M30 4l2.6 5.6 6 .8-4.5 4.1 1.1 6L30 23.6l-5.2 2.9 1.1-6-4.5-4.1 6-.8z" fill="#f4b740"/>';
    else s+='<circle cx="30" cy="24" r="3" fill="#0b5c55"/>';
    return s+'</svg>';
  }

  // 옵션 UI 만들기
  function buildOptions(){
    var cw = document.getElementById('d-colors'); cw.innerHTML='';
    COLORS.forEach(function(col){
      var b=document.createElement('button'); b.className='opt'+(col.id===sel.color?' sel':'');
      b.innerHTML=swatchColor(col); b.onclick=function(){ sel.color=col.id; markSel('d-colors',b); render(); };
      cw.appendChild(b);
    });
    var ew = document.getElementById('d-eyes'); ew.innerHTML='';
    EYES.forEach(function(k){
      var b=document.createElement('button'); b.className='opt'+(k===sel.eyes?' sel':'');
      b.innerHTML=eyeIcon(k); b.onclick=function(){ sel.eyes=k; markSel('d-eyes',b); render(); };
      ew.appendChild(b);
    });
    var aw = document.getElementById('d-ant'); aw.innerHTML='';
    ANT.forEach(function(k){
      var b=document.createElement('button'); b.className='opt'+(k===sel.ant?' sel':'');
      b.innerHTML=antIcon(k); b.onclick=function(){ sel.ant=k; markSel('d-ant',b); render(); };
      aw.appendChild(b);
    });
  }
  function markSel(wrapId, btn){
    document.querySelectorAll('#'+wrapId+' .opt').forEach(function(o){ o.classList.remove('sel'); });
    btn.classList.add('sel');
  }

  function pickJob(btn){
    document.querySelectorAll('#d-jobs .chip').forEach(function(c){ c.classList.remove('sel'); });
    btn.classList.add('sel');
    sel.job = btn.getAttribute('data-job');
    render();
  }

  function jobText(){ return sel.job ? (sel.job + ' AI') : '하는 일을 골라주세요'; }

  function render(){
    sel.name = document.getElementById('d-name').value.trim();
    document.getElementById('p-avatar').innerHTML = robotSVG(sel.color, sel.eyes, sel.ant);
    document.getElementById('p-name').textContent = sel.name || '이름을 지어주세요';
    document.getElementById('p-job').textContent = jobText();
  }

  // ===== ③ 완성 =====
  function finish(){
    var name = document.getElementById('d-name').value.trim() || '나의 AI';
    document.getElementById('e-avatar').innerHTML = robotSVG(sel.color, sel.eyes, sel.ant);
    document.getElementById('e-name').textContent = name;
    document.getElementById('e-job').textContent = sel.job ? (sel.job + ' AI') : '멋진 일을 하는 AI';
    makeConfetti();
    go('s-end');
    var card = document.querySelector('#s-end .big-card');
    card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  }

  function makeConfetti(){
    var wrap = document.getElementById('conf');
    if(wrap.childElementCount) return;
    var cols=['#f4b740','#0f766e','#e5533b','#37c4a4','#8b5cf6','#3b7de5'];
    for(var i=0;i<24;i++){
      var i2=document.createElement('i');
      i2.style.left=(Math.random()*100)+'%';
      i2.style.background=cols[i%cols.length];
      i2.style.animationDelay=(Math.random()*2.4)+'s';
      i2.style.animationDuration=(2+Math.random()*1.4)+'s';
      wrap.appendChild(i2);
    }
  }

  function restart(){
    document.getElementById('d-name').value='';
    sel={ color:'teal', eyes:'round', ant:'ball', job:'', name:'' };
    document.querySelectorAll('#d-jobs .chip').forEach(function(c){ c.classList.remove('sel'); });
    buildOptions(); render();
    go('s-design');
  }

  // 초기화
  buildOptions(); render();
</script>
</body>
</html>
