<!DOCTYPE html>
<html lang="ko" data-present="fill">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수업 슬라이드 템플릿</title>
<!-- 발표(전체화면) 규칙 — 이 구조를 지키면 화면 꽉 채움 + 다음버튼 항상 보임 -->
<style>
  :root{
    --brand:#0f766e; --brand2:#0b5c55; --gold:#f4b740; --ink:#243b34;
    --muted:#5b6f68; --line:#e3e9e2; --paper:#ffffff;
    --body:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{ box-sizing:border-box; word-break:keep-all; overflow-wrap:break-word; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:var(--body); color:var(--ink);
    background:linear-gradient(165deg,#E9EDE4 0%, #D7DFCE 100%);
    display:flex; align-items:center; justify-content:center; padding:clamp(8px,3vw,24px);
  }
  /* ===== 발표 모드가 요구하는 3층 구조: .deck > (.topbar / .board / .foot) ===== */
  .deck{
    width:min(1680px,94vw); height:min(940px,92vh);      /* 평소엔 카드, 발표 땐 화면 꽉 채움 */
    background:var(--paper); border-radius:clamp(14px,2.4vw,20px);
    box-shadow:0 18px 50px rgba(30,50,40,.24); overflow:hidden;
    display:flex; flex-direction:column;                  /* ← 필수: 세로 3층 */
  }
  .topbar{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
           padding:clamp(11px,2vw,14px) clamp(16px,3.5vw,24px); border-bottom:1px solid var(--line); }
  .course{ font-size:clamp(11.5px,2.3vw,13px); font-weight:700; color:var(--muted); }
  .course b{ color:var(--brand); }
  .counter{ font-size:clamp(11.5px,2.3vw,13px); font-weight:800; font-variant-numeric:tabular-nums; }

  .board{ flex:1 1 auto; min-height:0; overflow:auto;     /* ← 필수: 여기만 스크롤(넘쳐도 버튼 안 잘림) */
          padding:clamp(28px,4.6vw,52px); }
  .slide{ display:none; }
  .slide.on{ display:block; }
  .eyebrow{ font-size:clamp(12px,2.5vw,14px); font-weight:800; color:var(--brand); }
  .h1{ font-size:clamp(1.6rem,5.4vw,2.5rem); font-weight:800; line-height:1.32; margin:.4rem 0 0; }
  .lead{ font-size:clamp(1.02rem,2.8vw,1.3rem); font-weight:600; color:var(--muted); line-height:1.6; margin:.9rem 0 0; max-width:46ch; }
  .bullets{ margin:1rem 0 0; padding-left:1.2em; }
  .bullets li{ font-size:clamp(1.02rem,2.8vw,1.26rem); font-weight:600; line-height:1.6; margin-bottom:.7rem; }
  /* 영상 자리(선택): 관리자가 사이트에서 링크만 바꿔 넣음 */
  .videoframe{ margin-top:1rem; position:relative; width:100%; aspect-ratio:16/9; background:var(--brand2); border-radius:14px; overflow:hidden; }
  .videoframe iframe, .videoframe video{ position:absolute; inset:0; width:100%; height:100%; border:0; }

  .foot{ flex:0 0 auto; display:flex; align-items:center; gap:clamp(12px,3vw,16px);
         padding:clamp(12px,2.2vw,16px) clamp(16px,3.5vw,24px); border-top:1px solid var(--line); }
  .progress{ flex:1; height:7px; background:var(--line); border-radius:4px; overflow:hidden; }
  .progress i{ display:block; height:100%; background:var(--gold); width:0; transition:width .35s ease; }
  .nav{ border:1px solid var(--line); background:#fff; color:var(--ink); font-weight:800;
        font-size:clamp(14px,2.6vw,15px); padding:12px clamp(18px,4vw,24px); border-radius:11px; cursor:pointer; }
  .nav.primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .nav:disabled{ opacity:.34; cursor:default; }
</style>
</head>
<body>
  <div class="deck">
    <div class="topbar">
      <!-- data-title: 사이트 링크 라벨(?title=)이 이 글자를 자동 교체 -->
      <div class="course"><b data-title>초2 · 인공지능</b> · 1차시</div>
      <div class="counter"><span id="cur">1</span> / <span id="total">1</span></div>
    </div>

    <div class="board">
      <!-- 슬라이드 한 장 = .slide 하나. 첫 장에만 on -->
      <section class="slide on">
        <div class="eyebrow">● 학습 목표</div>
        <h1 class="h1">여기에 슬라이드 제목</h1>
        <p class="lead">한 줄 소개 문장.</p>
        <ul class="bullets">
          <li>핵심 내용 1</li>
          <li>핵심 내용 2</li>
        </ul>
        <!-- 영상 넣을 자리면 아래 주석 해제 -->
        <!-- <div class="videoframe" data-video></div> -->
      </section>

      <section class="slide">
        <div class="eyebrow">● 활동</div>
        <h1 class="h1">둘째 슬라이드</h1>
        <p class="lead">다음 장 예시.</p>
      </section>
    </div>

    <div class="foot">
      <button class="nav" id="prev" disabled>이전</button>
      <div class="progress"><i id="bar"></i></div>
      <button class="nav primary" id="next">다음</button>
    </div>
  </div>

<script>
  // 슬라이드 넘김 — 구조만 지키면 이 스크립트 그대로 재사용
  (function(){
    var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    var i = 0, total = slides.length;
    var cur = document.getElementById('cur'), tot = document.getElementById('total');
    var bar = document.getElementById('bar'), prev = document.getElementById('prev'), next = document.getElementById('next');
    tot.textContent = total;
    function render(){
      slides.forEach(function(s,n){ s.classList.toggle('on', n===i); });
      cur.textContent = i+1;
      bar.style.width = ((i+1)/total*100)+'%';
      prev.disabled = i===0; next.disabled = i===total-1;
      document.querySelector('.board').scrollTop = 0;
    }
    prev.onclick = function(){ if(i>0){ i--; render(); } };
    next.onclick = function(){ if(i<total-1){ i++; render(); } };
    document.addEventListener('keydown', function(e){
      if(e.key==='ArrowRight'||e.key===' ') next.onclick();
      if(e.key==='ArrowLeft') prev.onclick();
    });
    render();
  })();
</script>
</body>
</html>
