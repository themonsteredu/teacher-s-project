<!doctype html>
<!--
  ┌─────────────────────────────────────────────────────────────┐
  │  교안·웹앱 템플릿                                             │
  │  이 파일을 복사 → 이름 바꾸고 → 내용만 채우면 됩니다.        │
  │                                                              │
  │  규칙 (허브가 웹앱으로 실행해주는 조건):                     │
  │   1. 파일 하나로 완결 — CSS·JS를 이 파일 안에 직접 (바깥      │
  │      .css/.js/이미지 파일 참조 금지)                          │
  │   2. 3.5MB 이하                                               │
  │   3. 브라우저 안에서만 도는 것 (서버·DB 필요 없는 것)         │
  │                                                              │
  │  자세한 설명은 같은 폴더의 README.md 참고.                    │
  └─────────────────────────────────────────────────────────────┘
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수업 제목을 여기에</title>
  <style>
    /* ===== 색·기본값 (원하면 색만 바꿔도 분위기가 달라집니다) ===== */
    :root {
      --brand: #2563eb;     /* 강조색 */
      --bg: #f8fafc;        /* 배경 */
      --card: #ffffff;      /* 카드 배경 */
      --text: #1e293b;      /* 글자 */
      --muted: #64748b;     /* 흐린 글자 */
      --line: #e2e8f0;      /* 테두리 */
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0; padding: 24px;
      background: var(--bg); color: var(--text);
      line-height: 1.6;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { color: var(--brand); margin: 0 0 4px; font-size: 1.8rem; }
    .sub { color: var(--muted); margin: 0; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 20px; margin-bottom: 16px;
    }
    button {
      font: inherit; cursor: pointer;
      background: var(--brand); color: #fff; border: none;
      padding: 12px 20px; border-radius: 10px; font-weight: 600;
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }
    /* 태블릿·휴대폰 대응 */
    @media (max-width: 480px) { body { padding: 16px; } h1 { font-size: 1.5rem; } }
  </style>
</head>
<body>
  <div class="wrap">

    <header>
      <h1>수업 제목</h1>
      <p class="sub">한 줄 설명 · 대상 학년</p>
    </header>

    <!-- ===== 여기부터 내용을 채우세요 ===== -->
    <div class="card">
      <p>여기에 활동 내용을 넣습니다.</p>
      <button id="btn">눌러보기</button>
      <p id="out"></p>
    </div>
    <!-- ===== 여기까지 ===== -->

  </div>

  <script>
    // ===== 여기에 동작을 씁니다 =====
    const btn = document.getElementById('btn');
    const out = document.getElementById('out');
    let count = 0;
    btn.addEventListener('click', () => {
      count += 1;
      out.textContent = count + '번 눌렀어요!';
    });
  </script>
</body>
</html>
